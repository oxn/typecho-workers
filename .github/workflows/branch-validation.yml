name: Branch validation

on:
  push:
    branches:
      - test/clean-upstream-warm-cy
      - release/2026-11-03-warm-cy-without-markdown
      - feature/markdown-plugin-completion
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Build Astro application
        run: bun run build

      - name: Verify Markdown plugin client assets
        run: |
          for asset in \
            markdown-loader.js \
            markdown-math.js markdown-math.css \
            markdown-mermaid-core.js markdown-mermaid-core.css \
            markdown-highlighter.js markdown-highlighter.css; do
            test -s "public/plugin-assets/typecho-plugin-markdown/$asset" || {
              echo "Missing Markdown client asset: $asset"
              exit 1
            }
          done
