name: Markdown branch validation

on:
  push:
    branches:
      - feature/markdown-full-support
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Upload resolved Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: markdown-bun-lock
          path: bun.lock
          if-no-files-found: error

      - name: Run unit tests
        run: bun run test

      - name: Build application
        run: bun run build
