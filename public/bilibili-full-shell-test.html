<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Bilibili 完整主题结构测试</title>
  <link rel="stylesheet" href="/themes/typecho-theme-warm-cy/style.css">
  <style>
    /* 模拟 WarmShell + Post 的页面结构；不加载站点脚本。 */
    .warm-article__header { margin: 0 0 2rem; }
    .warm-article__body { position: relative; min-width: 0; }
    .warm-prose iframe {
      display: block;
      width: 100%;
      min-height: 400px;
      margin: 1rem 0;
      border: 0;
    }
    .test-note {
      margin: 1rem 0;
      padding: 12px 14px;
      border: 1px solid var(--warm-border, #ebe8e3);
      color: var(--warm-muted, #6f6c68);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body class="warm-theme">
  <a class="warm-skip-link" href="#warm-content">跳至正文</a>
  <header class="warm-header">
    <div class="warm-header__inner">
      <a class="warm-brand" href="/">
        <span class="warm-brand__title">OOOK.TOP</span>
        <span class="warm-brand__description">Bilibili 播放器兼容性测试</span>
      </a>
      <nav class="warm-nav" aria-label="主导航">
        <a class="warm-nav__link" href="/">首页</a>
        <a class="warm-nav__link" href="/2026/10/29/bilibiliuid.html">原文章</a>
      </nav>
    </div>
  </header>
  <main id="warm-content" class="warm-main warm-main--detail" tabindex="-1">
    <article class="warm-article">
      <header class="warm-article__header warm-article__hero">
        <div class="warm-article__hero-inner">
          <div class="warm-item-meta"><span>测试页面</span></div>
          <h1>完整主题结构 + 原始播放器地址</h1>
          <p class="warm-article__summary">此页使用主题完整页面布局，但不加载 InstantClick、ViewImage 等脚本。</p>
        </div>
      </header>
      <div class="warm-article__body">
        <div class="warm-prose" view-image itemprop="articleBody">
          <p>下面使用原文章中的完整 Bilibili 播放器地址和参数。</p>
          <div class="test-note" id="test-status">检测中……</div>
          <iframe
            src="https://player.bilibili.com/player.html?isOutside=true&amp;aid=117041382098906&amp;bvid=BV1GGMC6YEMc&amp;cid=40613054036&amp;p=1&amp;as_wide=1&amp;high_quality=1&amp;danmaku=0"
            style="display:block;width:100%;min-height:400px;margin:1rem 0"
            title="Bilibili video player"
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </article>
  </main>
  <footer class="warm-footer">
    <div class="warm-footer__meta">
      <div class="warm-footer__copyright"><span>© OOOK.TOP</span></div>
      <nav aria-label="页脚链接"><a href="/">首页</a></nav>
    </div>
  </footer>
  <script>
    window.addEventListener('load', () => {
      const frame = document.querySelector('iframe');
      const rect = frame.getBoundingClientRect();
      const cssLoaded = [...document.styleSheets].some(s => s.href && s.href.includes('/themes/typecho-theme-warm-cy/style.css'));
      document.getElementById('test-status').textContent =
        '主题 CSS：' + (cssLoaded ? '已加载' : '未检测到') +
        '；iframe 宽度：' + Math.round(rect.width) + 'px；高度：' + Math.round(rect.height) +
        'px；本页未加载 InstantClick / ViewImage 脚本。';
    }, { once: true });
  </script>
</body>
</html>
