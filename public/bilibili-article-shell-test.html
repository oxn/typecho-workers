<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Bilibili 完整主题外壳测试</title>
  <link rel="stylesheet" href="/themes/typecho-theme-warm-cy/style.css">
  <style>
    /* 复刻 WarmShell + 文章页的外层结构；不加载 WarmShell 的交互脚本。 */
    .warm-main--detail { min-height: 60vh; }
    .warm-article__header { margin: 56px 0 36px; }
    .warm-article__hero-inner { max-width: 100%; }
    .warm-article__body { position: relative; min-width: 0; }
    .warm-prose { min-width: 0; }
    .warm-article__footer { margin-top: 40px; }
    .test-note { margin: 12px 0 20px; padding: 10px 12px; background: #f3f4f6; color: #333; font: 14px/1.6 system-ui,sans-serif; overflow-wrap: anywhere; }
    @media (max-width: 639px) {
      .warm-article__header { margin-top: 36px; }
    }
  </style>
</head>
<body class="warm-theme">
  <a class="warm-skip-link" href="#warm-content">跳至正文</a>
  <header class="warm-header">
    <div class="warm-header__inner">
      <a href="/" class="warm-brand" aria-label="首页">
        <span class="warm-brand__title">OOOK.TOP</span>
        <span class="warm-brand__description">Bilibili 播放器兼容性测试</span>
      </a>
      <nav class="warm-nav" aria-label="主导航">
        <a class="warm-nav__link" href="/">首页</a>
        <a class="warm-nav__link" href="/?stream=posts">文章</a>
      </nav>
    </div>
  </header>
  <main id="warm-content" class="warm-main warm-main--detail" tabindex="-1">
    <article class="warm-article">
      <header class="warm-article__header warm-article__hero">
        <div class="warm-article__hero-inner">
          <div class="warm-item-meta"><span>文章</span><span aria-hidden="true">·</span><span>播放器测试</span></div>
          <h1>完整主题外壳与原始播放器地址测试</h1>
          <p class="warm-article__summary">此页面用于对照真实文章页，不加载 InstantClick、ViewImage 和文章交互脚本。</p>
        </div>
      </header>
      <div class="test-note" id="status">正在检测……</div>
      <div class="warm-article__body">
        <div class="warm-prose" view-image itemprop="articleBody">
          <p>下面使用原文章中的 Bilibili iframe 地址与参数。</p>
          <iframe
            src="https://player.bilibili.com/player.html?isOutside=true&aid=117041382098906&bvid=BV1GGMC6YEMc&cid=40613054036&p=1&as_wide=1&high_quality=1&danmaku=0"
            title="Bilibili video player"
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin"
            style="display:block;width:100%;min-height:400px;margin:1rem 0"
            allowfullscreen>
          </iframe>
        </div>
      </div>
      <footer class="warm-article__footer"></footer>
    </article>
  </main>
  <footer class="warm-footer">
    <div class="warm-footer__meta">
      <div class="warm-footer__copyright"><span>© OOOK.TOP</span></div>
      <nav aria-label="页脚链接"><a href="/">首页</a></nav>
    </div>
  </footer>
  <script>
    (() => {
      const status = document.getElementById('status');
      const frame = document.querySelector('iframe');
      const report = () => {
        const rect = frame.getBoundingClientRect();
        const style = getComputedStyle(frame);
        status.textContent = '页面脚本：未加载 InstantClick / ViewImage；iframe display：' +
          style.display + '；宽度：' + Math.round(rect.width) + 'px；高度：' +
          Math.round(rect.height) + 'px。请观察播放器是否正常显示。';
      };
      if (document.readyState === 'complete') report();
      else window.addEventListener('load', report, { once: true });
    })();
  </script>
</body>
</html>
