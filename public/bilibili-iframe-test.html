<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Bilibili iframe 独立测试</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      padding: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 600;
    }
    p {
      margin: 0 0 12px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
    iframe {
      display: block;
      width: 100%;
      height: 400px;
      border: 0;
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bilibili iframe 独立测试</h1>
    <p>此页面不经过 Typecho 文章内容、Markdown 渲染或主题组件。</p>
    <iframe
      src="https://player.bilibili.com/player.html?bvid=BV1GGMC6YEMc"
      title="Bilibili 视频播放器独立测试"
      width="100%"
      height="400"
      scrolling="no"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
