<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Bilibili Markdown 输出结构测试</title>
  <link rel="stylesheet" href="/themes/typecho-theme-warm-cy/style.css">
  <style>
    .warm-main--detail { min-height: 60vh; }
    .warm-article__header { margin: 48px 0 32px; }
    .warm-article__body { position: relative; min-width: 0; }
    .warm-prose { min-width: 0; }
    .test-case { margin: 28px 0; padding: 16px; border: 1px solid var(--warm-border); border-radius: 8px; }
    .test-case h2 { margin-top: 0; font-size: 18px; }
    .test-result { margin-top: 8px; color: var(--warm-muted); font: 13px/1.6 system-ui,sans-serif; overflow-wrap: anywhere; }
    .warm-prose iframe { display: block; width: 100%; max-width: 100%; border: 0; }
  </style>
</head>
<body class="warm-theme">
  <a class="warm-skip-link" href="#warm-content">跳至正文</a>
  <header class="warm-header">
    <div class="warm-header__inner">
      <a href="/" class="warm-brand"><span class="warm-brand__title">OOOK.TOP</span><span class="warm-brand__description">Markdown iframe 输出结构测试</span></a>
      <nav class="warm-nav"><a class="warm-nav__link" href="/">首页</a></nav>
    </div>
  </header>
  <main id="warm-content" class="warm-main warm-main--detail" tabindex="-1">
    <article class="warm-article">
      <header class="warm-article__header warm-article__hero">
        <div class="warm-article__hero-inner">
          <div class="warm-item-meta"><span>诊断页面</span></div>
          <h1>Markdown iframe 最终输出结构测试</h1>
          <p class="warm-article__summary">两个播放器使用相同地址和转换后的属性，仅 HTML 包裹结构不同。</p>
        </div>
      </header>
      <div class="warm-article__body">
        <div class="warm-prose" view-image itemprop="articleBody">
          <section class="test-case">
            <h2>测试 A：iframe 直接位于正文中</h2>
            <iframe
              src="https://player.bilibili.com/player.html?isOutside=true&aid=117041382098906&bvid=BV1GGMC6YEMc&cid=40613054036&p=1&as_wide=1&high_quality=1&danmaku=0"
              title="Embedded content"
              loading="eager"
              referrerpolicy="strict-origin-when-cross-origin"
              style="display:block;width:100%;min-height:400px;margin:1rem 0"
              allowfullscreen="">
            </iframe>
            <div class="test-result" id="result-a">正在检测……</div>
          </section>
          <section class="test-case">
            <h2>测试 B：iframe 被段落标签包裹</h2>
            <p>
              <iframe
                src="https://player.bilibili.com/player.html?isOutside=true&aid=117041382098906&bvid=BV1GGMC6YEMc&cid=40613054036&p=1&as_wide=1&high_quality=1&danmaku=0"
                title="Embedded content"
                loading="eager"
                referrerpolicy="strict-origin-when-cross-origin"
                style="display:block;width:100%;min-height:400px;margin:1rem 0"
                allowfullscreen="">
              </iframe>
            </p>
            <div class="test-result" id="result-b">正在检测……</div>
          </section>
        </div>
      </div>
    </article>
  </main>
  <footer class="warm-footer"><div class="warm-footer__meta"><div class="warm-footer__copyright"><span>© OOOK.TOP</span></div></div></footer>
  <script>
    (() => {
      for (const [id, selector] of [['result-a', '.test-case:nth-of-type(1) iframe'], ['result-b', '.test-case:nth-of-type(2) iframe']]) {
        const frame = document.querySelector('#' + id).parentElement.querySelector('iframe');
        const report = () => {
          const rect = frame.getBoundingClientRect();
          const style = getComputedStyle(frame);
          document.getElementById(id).textContent =
            'iframe display：' + style.display + '；宽度：' + Math.round(rect.width) +
            'px；高度：' + Math.round(rect.height) + 'px；父元素：' +
            frame.parentElement.tagName.toLowerCase();
        };
        if (document.readyState === 'complete') report();
        else window.addEventListener('load', report, { once: true });
      }
    })();
  </script>
</body>
</html>
