<script data-no-instant>
(() => {
  if (window.ViewImage) ViewImage.init('[view-image] img');
  if (window.InstantClick?.supported) window.InstantClick.init('mousedown');
  window.addEventListener('instantclick:newpage', () => {
    const status = document.getElementById('instantclick-result');
    if (status) status.textContent = '已收到 instantclick:newpage 事件：本次确实经过 InstantClick 无刷新切换。';
  });
})();
</script>
